name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "BeyonderLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/BeyonderLauncher-source BeyonderLauncher-${{ env.VERSION }}
          mv BeyonderLauncher-Linux-Qt6-Portable*/BeyonderLauncher-portable.tar.gz BeyonderLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv BeyonderLauncher-*.AppImage/BeyonderLauncher-*-x86_64.AppImage BeyonderLauncher-Linux-x86_64.AppImage
          mv BeyonderLauncher-*.AppImage.zsync/BeyonderLauncher-*-x86_64.AppImage.zsync BeyonderLauncher-Linux-x86_64.AppImage.zsync

          tar --exclude='.git' -czf BeyonderLauncher-${{ env.VERSION }}.tar.gz BeyonderLauncher-${{ env.VERSION }}

          for d in BeyonderLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="BeyonderLauncher-Windows-MSVC"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv BeyonderLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Beyonder Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            BeyonderLauncher-Linux-x86_64.AppImage
            BeyonderLauncher-Linux-x86_64.AppImage.zsync
            BeyonderLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            BeyonderLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            BeyonderLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            BeyonderLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            BeyonderLauncher-${{ env.VERSION }}.tar.gz
